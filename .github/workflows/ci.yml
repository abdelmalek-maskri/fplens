name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Nothing here writes to the repo, so ask for no more than reading it.
permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: pip install ruff
      - run: ruff check ml/ api/ job/
      - run: ruff format --check ml/ api/ job/

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-job.txt

      # The job's file covers both suites: it is a superset of the API's, and
      # job/tests loads real models. Neither needs torch, transformers or spacy.
      # httpx is test-only: starlette's TestClient needs it, nothing at runtime does.
      - run: pip install -r requirements-job.txt -r requirements-api.txt pytest httpx==0.28.1

      # `python -m` puts the repo root on sys.path, which the api.* / ml.*
      # imports need. Bare `pytest` fails with ModuleNotFoundError.
      - run: python -m pytest api/tests job/tests -q
